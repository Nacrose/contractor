name: Client Cross-Platform CI

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/**'
      - 'packages/**'
      - 'crates/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - 'packages/**'
      - 'crates/**'
      - '.github/workflows/client-ci.yml'

jobs:
  lint_and_protocol:
    name: Protocol & Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Protocol Register Linter
        run: node scripts/lint-protocol.mjs

      - name: Check generated platform tokens
        run: node packages/design_tokens/tool/generate.mjs --check

      - name: Run Server Semantic Parity Fixtures
        run: node scripts/test-semantic-parity.mjs

      - name: Run Native Adapter Contract Tests
        run: node packages/native_adapter/tool/check.mjs

      - name: Run Native Identity Contract Tests
        run: node packages/native_identity/tool/check.mjs

      - name: Run Native SQLite Durability Harness
        run: python3 prototype/construction_client/tool/sqlite_durability_harness.py

      - name: Setup Flutter (Pinned 3.47.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Flutter Analyze & Test (if prototype exists)
        run: |
          if [ -f "prototype/construction_client/pubspec.yaml" ]; then
            cd prototype/construction_client
            flutter pub get
            flutter analyze
            # VM only: kernel fixture/parity tests use real file IO, which the
            # Chrome (DDC) platform cannot provide. Browser coverage for the
            # shared UI contracts runs in the dedicated shared_ui_contracts job.
            flutter test
          else
            echo "Prototype pubspec.yaml not present yet; skipping Flutter unit tests."
          fi

  build_web:
    name: Build Web Target
    needs: lint_and_protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (Pinned 3.47.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Build Flutter Web Bundle
        run: |
          if [ -f "prototype/construction_client/pubspec.yaml" ]; then
            cd prototype/construction_client
            flutter pub get
            flutter build web --wasm --release
          else
            echo "Prototype not yet present; skipping web build."
          fi

  build_desktop_linux:
    name: Build Linux Desktop Target
    needs: lint_and_protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter (Pinned 3.47.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Build Linux Desktop Binary
        run: |
          if [ -f "prototype/construction_client/pubspec.yaml" ]; then
            cd prototype/construction_client
            flutter pub get
            flutter build linux --release
          else
            echo "Prototype not yet present; skipping Linux build."
          fi

  build_android:
    name: Build Android Target
    needs: lint_and_protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Pinned 3.47.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          if [ -f "prototype/construction_client/pubspec.yaml" ]; then
            cd prototype/construction_client
            flutter pub get
            flutter build apk --release
          else
            echo "Prototype not yet present; skipping Android build."
          fi

  shared_ui_contracts:
    name: Shared Flutter UI Contracts (Native + Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (Pinned 3.47.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Analyze & Test shared Flutter UI package
        run: |
          if [ -f "packages/construction_ui/pubspec.yaml" ]; then
            cd packages/construction_ui
            flutter pub get
            flutter analyze
            flutter test
            flutter test --platform chrome
          else
            echo "Shared Flutter UI package not present yet; skipping package checks."
          fi
